<!DOCTYPE html>
<html>
<head>
<title>Erm is this yours...?</title>
</head>

<body>
<h1>Checking credentials...</h1>

<script>
const target = "https://openmediavault.tailfbb7bc.ts.net/homepage";

// Wait 2 seconds so the "Checking credentials..." message is visible
setTimeout(() => {
  fetch(target, {
    method: "GET",
    mode: "no-cors",
    credentials: "include"
  })
  .then(response => {
    window.location.href = target;
  })
  .catch(() => {
    document.body.innerHTML = `
    <h1>🚫 Yeah, didn't think so! 🤨</h1>
    <p>This is Sean's. Kick rocks buddy.</p>
    <p>Access denied</p>
    `;
  });
}, 1000);
</script>

</body>
</html>
