<!DOCTYPE html>
<html>
<head>
<title>Erm is this yours...?</title>
</head>

<body>
<h1>Checking credentials...</h1>

<script>
const target = "https://openmediavault.tailfbb7bc.ts.net/homepage";

fetch(target, {
  method: "HEAD",
  mode: "cors",
  credentials: "include"
})
.then(response => {
  if (response.ok || response.status === 405) {
    // 405 means the server doesn't allow HEAD, but you reached it
    window.location.href = target;
  } else {
    throw new Error(`Status ${response.status}`);
  }
})
.catch(() => {
  document.body.innerHTML = `
  <h1>🚫 Yeah, didn't think so! 🤨</h1>
  <p>This is Sean's. Kick rocks buddy.</p>
  <p>Access denied</p>
  `;
});
</script>

</body>
</html>
