<body>
<h1>🤨 Checking credentials...</h1>

<script>
const target = "https://openmediavault:8086";

fetch(target, {mode:"no-cors"})
.then(() => {
    window.location.href = target;
})
.catch(() => {
    document.body.innerHTML = `
    <h1>🚫 Nice try.</h1>
    <p>This QR code belongs to a private Tailnet.</p>
    <p>Access denied 🤨</p>
    `;
});
</script>
